name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
      DATABASE_PATH: ./data/ci-intervaiew.db
      MAX_RESUME_CHARACTERS: 20000
      MAX_JOB_DESCRIPTION_CHARACTERS: 20000
      AI_REQUEST_TIMEOUT_MS: 60000
      AI_MAX_RETRIES: 2
      OPENAI_REALTIME_ENABLED: "false"
      REALTIME_FAKE_ENABLED: "true"
      TRANSCRIPT_LAB_FAKE_ENABLED: "true"
      QUESTION_BOUNDARY_FAKE_SEMANTIC_ENABLED: "true"
      QUESTION_UNDERSTANDING_FAKE_SEMANTIC_ENABLED: "true"
      UPLOADED_AUDIO_ENABLED: "true"
      UPLOADED_AUDIO_FAKE_TRANSCRIPTION_ENABLED: "true"
      UPLOADED_AUDIO_MAX_BYTES: 26214400
      UPLOADED_AUDIO_PATH: ./data/ci-uploaded-audio
      QUESTION_BOUNDARY_SHORT_PAUSE_MS: 500
      QUESTION_BOUNDARY_MEDIUM_PAUSE_MS: 1400
      QUESTION_BOUNDARY_LONG_PAUSE_MS: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm evaluate:boundary
      - run: pnpm evaluate:understanding
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
